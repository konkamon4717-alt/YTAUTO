channel:
  name: "นิทานหนึ่งนาที"
  language: th
  locale: th-TH

video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 45
  hard_max_seconds: 58

tts:
  # พากย์ด้วยตัวแรกที่ใช้ได้ ตัวไหนล่มก็ตกไปตัวถัดไป
  # edge-tts เป็นตัวเดียวที่คืนจังหวะรายคำมาให้ ตัวอื่นจะได้ซับหยาบระดับวรรคแทน
  backends: [edge-tts, pollinations, gtts]
  voice: th-TH-PremwadeeNeural
  rate: "+8%"
  pitch: "+0Hz"
  pollinations_model: community/NamanSoni78/FISH-AUDIO-S2.1-PRO

images:
  # ไล่ลองทีละรุ่นจนกว่าจะได้ภาพ กันกรณีรุ่นใดรุ่นหนึ่งล่มหรือถูกถอด
  models: [community/NamanSoni78/Z-Image-Turbo, flux, turbo]
  scenes: 10
  style: "soft storybook illustration, warm cinematic lighting, gentle painterly texture, muted earthy palette, no text, no watermark"

llm:
  # เขียนบทด้วยตัวแรกที่ใช้ได้ ตัวไหนเจ๊งก็ตกไปตัวถัดไปเอง
  backends: [gemini, pollinations]
  model: gemini-3.8-flash
  fallback_model: community/NamanSoni78/opus-5-max

subtitles:
  font: "Noto Sans Thai"
  font_size: 92
  max_chars_per_line: 20
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 6
  margin_v: 480

upload:
  privacy: private
  category_id: "24"
  made_for_kids: false
  self_declared_ai: true
  localizations: [en, es, pt, hi]

animation:
  # ทำให้ทุกฉากขยับ เรียงชั้นจากดีสุดลงมา ชั้นไหนตันก็ตกไปชั้นถัดไปเอง
  # modal กับ kaggle จะเปิดใช้ได้เมื่อสมัครบริการและตั้งค่าเสร็จ
  enabled: true
  backends: [huggingface]
  # เพดานกันบั๊กวนลูปเผาโควต้า ไม่เกี่ยวกับโควต้าจริงของผู้ให้บริการ
  max_shots_per_run: 40

run:
  per_day: 3
