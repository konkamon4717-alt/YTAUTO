channel:
  name: "นิทานหนึ่งนาที"
  language: th
  locale: th-TH

video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 45
  hard_max_seconds: 58

tts:
  # พากย์ด้วยตัวแรกที่ใช้ได้ ตัวไหนล่มก็ตกไปตัวถัดไป
  # edge-tts เป็นตัวเดียวที่คืนจังหวะรายคำมาให้ ตัวอื่นจะได้ซับหยาบระดับวรรคแทน
  backends: [edge-tts, pollinations, gtts]
  voice: th-TH-PremwadeeNeural
  rate: "+8%"
  pitch: "+0Hz"
  pollinations_model: community/NamanSoni78/FISH-AUDIO-S2.1-PRO

images:
  # ไล่ลองทีละรุ่นจนกว่าจะได้ภาพ กันกรณีรุ่นใดรุ่นหนึ่งล่มหรือถูกถอด
  models: [community/NamanSoni78/Z-Image-Turbo, flux, turbo]
  scenes: 10
  # สไตล์ตายตัวของช่อง ให้เข้าชุดกับปกช่อง (นกฮูกพ่อมดสีน้ำ) คนดูเลื่อนเจอต้องจำได้ทันที
  # เส้นหมึกชัดสีแบนยังช่วยให้โมเดลวิดีโอทำภาพบิดเบี้ยวน้อยกว่าภาพกึ่งเสมือนจริงด้วย
  style: "whimsical watercolor storybook illustration, soft glowing magical light, rich saturated fairytale colours, delicate ink linework, dreamy atmosphere, no text, no watermark"

llm:
  # เขียนบทด้วยตัวแรกที่ใช้ได้ ตัวไหนเจ๊งก็ตกไปตัวถัดไปเอง
  backends: [gemini, pollinations]
  model: gemini-3.8-flash
  fallback_model: community/NamanSoni78/opus-5-max

subtitles:
  font: "Noto Sans Thai"
  font_size: 92
  max_chars_per_line: 20
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 6
  margin_v: 480

upload:
  privacy: private
  category_id: "24"
  made_for_kids: false
  self_declared_ai: true
  localizations: [en, es, pt, hi]

animation:
  # ชั้นไหนตันก็ตกไปชั้นถัดไปเอง ชั้นล่างสุดคือกล้องเคลื่อนบนภาพนิ่ง ไม่มีวันล้ม
  enabled: true
  # เรียงตาม "คุณภาพ" ไม่ใช่ปริมาณ — บทเรียนจากการเทสต์จริง
  #
  # huggingface รัน Wan 2.2 ซึ่งภาพไม่สลาย คุณภาพดี แต่ได้ ~7 ช็อต/วัน
  # kaggle รัน LTX ซึ่งโควต้าเยอะมากแต่ภาพสีเพี้ยนและพื้นหลังจืด
  #
  # ฉากที่ขยับสวยสำคัญกว่าฉากที่ขยับได้ครบ คลิปที่ภาพแตกทำให้คนเลิกตามช่อง
  # ส่วนฉากที่ไม่ได้คิวขยับจะได้กล้องเคลื่อนบนภาพนิ่งซึ่งคมชัดเต็มความละเอียด
  backends: [huggingface, kaggle]
  kaggle_dataset: yt-auto-shots
  kaggle_kernel: yt-auto-animate
  kaggle_timeout_minutes: 90
  # ขยับกี่ฉากต่อคลิป ไล่จากฉากที่ importance สูงสุดลงมา
  # 2 ฉาก = ฮุกกับจุดหักมุม ซึ่งเป็นสองจุดที่ตัดสินว่าคนดูต่อหรือปัดทิ้ง
  # ตั้งไว้ 2 เพราะโควต้า Wan ต่อวันได้ ~7 ช็อต = 3 คลิป x 2 ฉาก พอดี
  max_shots_per_run: 2

run:
  per_day: 3
