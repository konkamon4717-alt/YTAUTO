channel:
  name: "นิทานหนึ่งนาที"
  language: th
  locale: th-TH

video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 45
  hard_max_seconds: 58

tts:
  # พากย์ด้วยตัวแรกที่ใช้ได้ ตัวไหนล่มก็ตกไปตัวถัดไป
  # edge-tts เป็นตัวเดียวที่คืนจังหวะรายคำมาให้ ตัวอื่นจะได้ซับหยาบระดับวรรคแทน
  backends: [edge-tts, pollinations, gtts]
  voice: th-TH-PremwadeeNeural
  rate: "+8%"
  pitch: "+0Hz"
  pollinations_model: community/NamanSoni78/FISH-AUDIO-S2.1-PRO

images:
  # ไล่ลองทีละรุ่นจนกว่าจะได้ภาพ กันกรณีรุ่นใดรุ่นหนึ่งล่มหรือถูกถอด
  models: [community/NamanSoni78/Z-Image-Turbo, flux, turbo]
  # 6 ฉาก ไม่ใช่ 10 เพราะโควต้า Wan ได้ 7 ช็อต/วัน
  # 1 ฉาก = 1 ช็อต ที่ถูก boomerang ยืดเป็นสองเท่า จึงขยับได้ครบทุกฉากพอดี
  scenes: 6
  # สไตล์ตายตัวของช่อง ให้เข้าชุดกับปกช่อง (นกฮูกพ่อมดสีน้ำ) คนดูเลื่อนเจอต้องจำได้ทันที
  # เส้นหมึกชัดสีแบนยังช่วยให้โมเดลวิดีโอทำภาพบิดเบี้ยวน้อยกว่าภาพกึ่งเสมือนจริงด้วย
  style: "whimsical watercolor storybook illustration, soft glowing magical light, rich saturated fairytale colours, delicate ink linework, dreamy atmosphere, no text, no watermark"

llm:
  # เขียนบทด้วยตัวแรกที่ใช้ได้ ตัวไหนเจ๊งก็ตกไปตัวถัดไปเอง
  backends: [gemini, pollinations]
  # ไล่ลองทีละรุ่นในแต่ละชั้น — รุ่นเรือธงติด 503 "high demand" บ่อยมาก
  # เคยเจอตอนที่ทั้งสองชั้นล่มพร้อมกันจนไม่ได้คลิปเลย รุ่นรองได้บทดีพอ ๆ กัน
  models: [gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3.1-flash-lite]
  fallback_models:
    - community/NamanSoni78/opus-5-max
    - community/NamanSoni78/GPT-5.5-xHigh
    - community/NamanSoni78/Glm-5.3-Thinking-Max

subtitles:
  font: "Noto Sans Thai"
  font_size: 92
  max_chars_per_line: 20
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 6
  margin_v: 480

upload:
  privacy: private
  category_id: "24"
  made_for_kids: false
  self_declared_ai: true
  localizations: [en, es, pt, hi]

animation:
  # ชั้นไหนตันก็ตกไปชั้นถัดไปเอง ชั้นล่างสุดคือกล้องเคลื่อนบนภาพนิ่ง ไม่มีวันล้ม
  enabled: true
  # เรียงตาม "คุณภาพ" ไม่ใช่ปริมาณ — บทเรียนจากการเทสต์จริง
  #
  # huggingface รัน Wan 2.2 ซึ่งภาพไม่สลาย คุณภาพดี แต่ได้ ~7 ช็อต/วัน
  #
  # kaggle ถูกถอดออกชั่วคราว — ไม่ใช่เพราะ Kaggle แต่เพราะโมเดล LTX ที่รันอยู่บนนั้น
  # ทำภาพละลายเป็นก้อนสีและสีเพี้ยน ซึ่งแย่กว่าภาพนิ่งคมชัดเสียอีก
  # ถ้าพิสูจน์ได้ว่า Wan 2.2 ใส่ T4 ลง ให้ใส่ kaggle กลับเข้ามาได้เลย
  #
  # หลักการ: ฉากที่ขยับสวยสำคัญกว่าฉากที่ขยับได้ครบ
  # ฉากที่ไม่ได้คิวขยับจะได้กล้องเคลื่อนบนภาพนิ่งซึ่งคมชัดเต็ม 1080x1920
  backends: [huggingface]
  # ขอคลิปจากโมเดลสั้น ๆ แล้วให้ boomerang ยืดเต็มฉากเอง
  # โควต้า ZeroGPU นับเป็น "วินาที GPU" ไม่ใช่จำนวนครั้ง — ขอ 5 วิคิด ~110 วิ GPU
  # ขอ 2.5 วิคิดราวครึ่งเดียว จำนวนช็อตต่อวันจึงเพิ่มเป็นเท่าตัว
  request_seconds: 2.5

  kaggle_dataset: yt-auto-shots
  kaggle_kernel: yt-auto-animate
  kaggle_timeout_minutes: 90
  # ขยับทุกฉาก — ได้เพราะลดเหลือวันละ 1 คลิป 6 ฉาก = 6 ช็อต จากโควต้า 7
  # และเพราะ render.conform() ต่อขาไป-ขากลับแล้ววน ทำให้ช็อต 3.75 วิ
  # ยืดเป็นฉาก 7.5 วิได้โดยไม่มีรอยต่อ (เฟรมสุดท้ายของขาไป = เฟรมแรกของขากลับ)
  max_shots_per_run: 6

run:
  # 1 คลิป/วัน ไม่ใช่ 3 — จงใจแลกปริมาณกับคุณภาพ
  # โควต้า Wan ฟรีได้ 7 ช็อต/วัน ถ้าทำ 3 คลิปจะขยับได้แค่ 2 ฉาก/คลิป
  # เพิ่มเป็น 3 คลิปได้เมื่อสมัคร HF PRO (~290 บาท/เดือน = 34 ช็อต/วัน)
  per_day: 1
