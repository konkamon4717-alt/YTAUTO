name: control

# สั่งงานระบบจากหน้าเว็บหรือแอป GitHub บนมือถือ — ใช้ตอนไม่ได้อยู่หน้าคอม
#
# ทุกคำสั่งจบลงที่ไฟล์ใน data/ ซึ่ง publish อ่านก่อนเริ่มทำงาน
# และสรุปสถานะลง docs/control.json ให้หน้าเว็บอ่านได้โดยไม่ต้องมีสิทธิ์พิเศษ
on:
  workflow_dispatch:
    inputs:
      action:
        description: "สิ่งที่ต้องการสั่ง"
        required: true
        type: choice
        options: [skip-today, pause, resume]
      channel:
        description: "ช่องที่จะสั่ง"
        required: true
        default: nithan
        type: string

permissions:
  contents: write

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ปรับสถานะ
        run: |
          DIR="data/${{ inputs.channel }}"
          mkdir -p "$DIR" "docs/${{ inputs.channel }}"
          case "${{ inputs.action }}" in
            skip-today)
              # เก็บเป็นวันที่ ไม่ใช่ธงเปิดปิด รอบของพรุ่งนี้จะกลับมาทำงานเองโดยไม่ต้องสั่งเปิด
              # รอบผลิตอยู่ช่วง 12:00-15:00 UTC ซึ่งตรงกับเย็นวันเดียวกันตามเวลาไทย
              # วันที่ UTC กับวันที่ไทยจึงเป็นวันเดียวกันเสมอสำหรับรอบพวกนี้
              date -u +%F > "$DIR/SKIP_UNTIL"
              ;;
            pause)
              date -u +%FT%TZ > "$DIR/PAUSED"
              ;;
            resume)
              rm -f "$DIR/PAUSED" "$DIR/SKIP_UNTIL"
              ;;
          esac

          PAUSED=$( [ -f "$DIR/PAUSED" ] && cat "$DIR/PAUSED" || echo "" )
          SKIP=$( [ -f "$DIR/SKIP_UNTIL" ] && cat "$DIR/SKIP_UNTIL" || echo "" )
          cat > "docs/${{ inputs.channel }}/control.json" <<JSON
          {
            "updated_at": "$(date -u +%FT%TZ)",
            "last_action": "${{ inputs.action }}",
            "paused_at": "$PAUSED",
            "skip_date": "$SKIP"
          }
          JSON

      - name: บันทึกกลับเข้า repo
        run: |
          git config user.name  "yt-auto bot"
          git config user.email "actions@github.com"
          git add data docs
          if ! git diff --staged --quiet; then
            git commit -m "chore: ${{ inputs.channel }} สั่ง ${{ inputs.action }} จากหน้าควบคุม"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
