name: publish

on:
  schedule:
    # cron ของ GitHub บน repo ฟรีเป็นแบบ best-effort — บางรอบมาช้าเป็นชั่วโมง
    # บางรอบถูกข้ามไปเลยตอนระบบโหลดหนัก จึงตั้งสามเวลาเป็นตาข่ายรองกัน
    # ตัว --once-per-day กันไม่ให้ได้คลิปเกินวันละรอบอยู่แล้ว รอบที่เหลือจะข้ามเอง
    #
    # เวลาไทย 19:00 / 20:30 / 22:00 (GitHub ใช้ UTC)
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "จำนวนคลิป"
        default: "1"
      upload:
        description: "อัปโหลดขึ้น YouTube จริงไหม"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # ประกาศไว้ระดับ job ครั้งเดียว ทุกขั้นตอนในงานนี้เห็นเหมือนกันหมด
      # เดิมประกาศไว้เฉพาะขั้นตอนที่สร้างคลิป แล้วมีแค่ 4 ตัวจากวันแรก
      # พอเพิ่มบริการใหม่เข้ามาก็ลืมอัปเดตที่นี่ ระบบจึงล้มทั้งที่ตัวตรวจสุขภาพเขียว
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}


    steps:
      - uses: actions/checkout@v4

      - name: เช็คว่าถูกสั่งหยุดไว้หรือเปล่า
        id: gate
        run: |
          # หยุดได้สองแบบ: PAUSED คือหยุดจนกว่าจะสั่งเปิด
          # ส่วน SKIP_UNTIL คือข้ามเฉพาะวันที่ระบุไว้ แล้วกลับมาเองโดยไม่ต้องสั่ง
          # ทั้งคู่ไม่ถือว่าระบบพัง เพราะเป็นสิ่งที่เราสั่งเอง
          STOP=false
          if [ -f data/PAUSED ]; then
            echo "::notice::ระบบถูกสั่งหยุดไว้ตั้งแต่ $(cat data/PAUSED) — ข้ามรอบนี้"
            STOP=true
          elif [ -f data/SKIP_UNTIL ] && [ "$(cat data/SKIP_UNTIL)" = "$(date -u +%F)" ]; then
            echo "::notice::สั่งงดลงคลิปวันนี้ไว้ — ข้ามรอบนี้"
            STOP=true
          fi
          echo "paused=$STOP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.paused == 'false'
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้ง ffmpeg และฟอนต์ไทย
        if: steps.gate.outputs.paused == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          mkdir -p assets/fonts
          find /usr/share/fonts -name 'NotoSansThai*' -exec cp {} assets/fonts/ \;
          ls -la assets/fonts

      - name: ติดตั้ง dependency
        if: steps.gate.outputs.paused == 'false'
        run: pip install -r requirements.txt

      - name: สร้างและอัปโหลดคลิป
        if: steps.gate.outputs.paused == 'false'
        run: |
          UPLOAD_FLAG=""
          if [ "${{ inputs.upload }}" = "false" ]; then UPLOAD_FLAG="--no-upload"; fi
          # รอบที่มาจากตารางเวลาต้องกันโพสต์ซ้ำ เพราะตั้งไว้หลายเวลาเป็นตาข่ายรอง
          # ส่วนรอบที่สั่งเองด้วยมือให้ทำทันทีโดยไม่ต้องเช็ค
          GUARD=""
          if [ "${{ github.event_name }}" = "schedule" ]; then GUARD="--once-per-day"; fi
          python -m src.pipeline --count "${{ inputs.count || 1 }}" $UPLOAD_FLAG $GUARD

      - name: ดึงตัวเลขช่องมาอัปเดต
        # ต้องทำหลังอัปคลิปเสมอ ไม่งั้นหน้าเว็บจะโชว์ยอดวิวของเมื่อวาน
        if: always() && steps.gate.outputs.paused == 'false'
        continue-on-error: true
        run: python -m src.stats

      - name: บันทึกสถานะกลับเข้า repo
        if: always() && steps.gate.outputs.paused == 'false'
        run: |
          git config user.name  "yt-auto bot"
          git config user.email "actions@github.com"
          git add data/history.json docs/status.json docs/channel.json docs/growth.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: อัปเดตสถานะ $(date -u +%F' '%T)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
